name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run python -m compileall -q custom_components/tcl_udp_ac tests
      - name: Build installable archive
        run: uv run python scripts/build_release_package.py

  metrics:
    name: Metrics (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx --from radon==6.0.1 radon cc custom_components/tcl_udp_ac -s -a
      - run: uvx --from radon==6.0.1 radon mi custom_components/tcl_udp_ac -s
