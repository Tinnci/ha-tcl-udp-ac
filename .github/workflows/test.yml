name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run python -m compileall -q custom_components/tcl_udp_ac tests
      - name: Build installable archive
        run: uv run python scripts/build_release_package.py

  metrics:
    name: Metrics (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uvx --from radon==6.0.1 radon cc custom_components/tcl_udp_ac -s -a
      - run: uvx --from radon==6.0.1 radon mi custom_components/tcl_udp_ac -s
