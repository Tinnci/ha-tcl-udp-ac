name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, for example v0.11.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  tests:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
  lint:
    needs: resolve
    uses: ./.github/workflows/lint.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
  validate:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}

  package:
    name: Publish verified integration
    needs: [resolve, tests, lint, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build HACS archive
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: uv run --locked python scripts/build_release_package.py --tag "$TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/tcl_udp_ac.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/tcl_udp_ac.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "TCL AC $TAG" --generate-notes
          fi
