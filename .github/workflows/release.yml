name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, for example v0.11.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  tests:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
  lint:
    needs: resolve
    uses: ./.github/workflows/lint.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
  validate:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}

  package:
    name: Publish verified integration
    needs: [resolve, tests, lint, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build HACS archive
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: uv run --locked python scripts/build_release_package.py --tag "$TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/tcl_udp_ac.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/tcl_udp_ac.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "TCL AC $TAG" --generate-notes
          fi
